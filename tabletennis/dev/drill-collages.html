<!doctype html><html><body style="margin:0;background:#000"><script type="module">
import { TOPICS, drillsFor } from '../src/drills/catalog';
import { renderCollage } from '../src/drills/media';
window.list = () => TOPICS.flatMap((t) => t.strokes.flatMap((s) => drillsFor(t, s).map(({ drill, stroke }) => ({ topic: t.id, drill: drill.id, stroke })))) ;
window.collage = async (topicId, drillId, stroke, hand = 'right') => {
  const t = TOPICS.find((x) => x.id === topicId);
  const d = t.drills.find((x) => x.id === drillId);
  const c = await renderCollage(d, d.motion(stroke), hand, d.cam);
  return c.toDataURL('image/jpeg', 0.85);
};
window.ok = true;
</script></body></html>
<script type="module">
import { TOPICS } from '../src/drills/catalog';
import { exportDrillVideo } from '../src/drills/media';
window.video = async (topicId, drillId, stroke) => {
  const t = TOPICS.find((x) => x.id === topicId); const d = t.drills.find((x) => x.id === drillId);
  return exportDrillVideo(d, t, stroke, d.motion(stroke), 'right', d.cam, (p) => console.log('p', p.toFixed(2)));
};
</script>
